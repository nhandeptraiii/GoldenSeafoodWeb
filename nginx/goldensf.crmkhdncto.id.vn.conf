# ═══════════════════════════════════════════════════════════════════
#  Nginx Host Config — Golden Seafood
#  File: /etc/nginx/sites-available/goldensf.crmkhdncto.id.vn
#  Server: 171.254.92.12 (Ubuntu)
# ═══════════════════════════════════════════════════════════════════

# ── HTTP → HTTPS redirect ───────────────────────────────────────────
server {
    listen 80;
    server_name goldensf.crmkhdncto.id.vn;

    # Certbot ACME challenge (gia hạn SSL tự động)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect toàn bộ sang HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS ───────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name goldensf.crmkhdncto.id.vn;

    # SSL Certificate (do Certbot tự cấp sau khi chạy lệnh bên dưới)
    ssl_certificate     /etc/letsencrypt/live/goldensf.crmkhdncto.id.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/goldensf.crmkhdncto.id.vn/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Giới hạn upload file 50MB
    client_max_body_size 50M;

    # ── Backend API (/api/) → port 8090 ─────────────────────────────
    location /api/ {
        proxy_pass http://localhost:8090;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout lớn để xử lý import dữ liệu (tương tự CRM/ThuCuoc)
        proxy_connect_timeout 86400s;
        proxy_send_timeout    86400s;
        proxy_read_timeout    86400s;
        send_timeout          86400s;
    }

    # ── Static uploads (/uploads/) → port 8090 ─────────────────────
    location /uploads/ {
        proxy_pass         http://localhost:8090;
        proxy_set_header   Host            $host;
        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }

    # ── Frontend React → port 8003 ──────────────────────────────────
    location / {
        proxy_pass         http://localhost:8003;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade         $http_upgrade;
        proxy_set_header   Connection      'upgrade';
        proxy_set_header   Host            $host;
        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
