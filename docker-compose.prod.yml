version: '3.8'

# ═══════════════════════════════════════════════════════════════════
#  Golden Seafood - Docker Compose Production
#  Domain : goldensf.crmkhdncto.id.vn
#  Server : 171.254.92.12
#
#  🔐 Secrets được đọc từ file .env.prod (KHÔNG commit lên Git)
#  📋 Tạo file .env.prod trên server từ template .env.prod.example
# ═══════════════════════════════════════════════════════════════════

services:

  # ── MySQL Database ──────────────────────────────────────────────
  goldenseafood_db:
    image: mysql:8.0
    container_name: goldenseafood_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD}"
      MYSQL_DATABASE: "${DB_NAME}"
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    ports:
      - "3308:3306"
    volumes:
      - goldenseafood_mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - goldenseafood_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── Node.js Backend API ─────────────────────────────────────────
  goldenseafood_backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: goldenseafood_backend
    restart: always
    environment:
      PORT: 3000
      NODE_ENV: production
      DB_HOST: goldenseafood_db
      DB_PORT: 3306
      DB_NAME: "${DB_NAME}"
      DB_USER: root
      DB_PASSWORD: "${DB_ROOT_PASSWORD}"
      JWT_SECRET: "${JWT_SECRET}"
      JWT_EXPIRES_IN: 7d
      UPLOAD_DIR: uploads
      MAX_FILE_SIZE: 52428800
      FRONTEND_URL: "https://goldensf.crmkhdncto.id.vn"
      WHATSAPP_NUMBER: "84945950099"
      SMTP_HOST: "${SMTP_HOST}"
      SMTP_PORT: "${SMTP_PORT}"
      SMTP_USER: "${SMTP_USER}"
      SMTP_PASS: "${SMTP_PASS}"
      SMTP_FROM_NAME: "${SMTP_FROM_NAME}"
      SMTP_FROM_EMAIL: "${SMTP_FROM_EMAIL}"
      NOTIFY_EMAIL: "${NOTIFY_EMAIL}"
      NOTIFY_EMAIL_CC: "${NOTIFY_EMAIL_CC}"
    ports:
      - "8090:3000"
    volumes:
      - goldenseafood_uploads:/app/uploads
    depends_on:
      goldenseafood_db:
        condition: service_healthy
    networks:
      - goldenseafood_net

  # ── React Frontend (nginx:alpine) ───────────────────────────────
  goldenseafood_frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: "https://goldensf.crmkhdncto.id.vn/api"
    container_name: goldenseafood_frontend
    restart: always
    ports:
      - "8003:80"
    depends_on:
      - goldenseafood_backend
    networks:
      - goldenseafood_net

# ── Networks ────────────────────────────────────────────────────────
networks:
  goldenseafood_net:
    driver: bridge

# ── Volumes ─────────────────────────────────────────────────────────
volumes:
  goldenseafood_mysql_data:
    driver: local
  goldenseafood_uploads:
    driver: local
